<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    
    <form>
        <label>Full Name:</label>
        <input type="text" name="full_name" placeholder="Enter your full name">
        <br><br>

        <label>PRN Number:</label>
        <input type="text" name="prn" placeholder="Enter your PRN">
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter password">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label>Course:</label>
        <select name="course">
            <option value="">Select Course</option>
            <option value="BTech CSE">BTech CSE</option>
            <option value="BTech IT">BTech IT</option>
            <option value="BTech ECE">BTech ECE</option>
            <option value="BTech Mechanical">BTech Mechanical</option>
        </select>
        <br><br>

        <label>Address:</label>
        <textarea name="address" rows="4" cols="30" placeholder="Enter your address"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>
</body>
</html>
